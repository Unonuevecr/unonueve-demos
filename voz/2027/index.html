const norm=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"");
async function abrir(cod){const e=new TextEncoder();
 const base=await crypto.subtle.importKey("raw",e.encode(norm(cod)),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2a(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(P.i)},k,b2a(P.c));
 document.open();document.write(new TextDecoder().decode(t));document.close();}
async function intentar(cod){const m=document.getElementById("m");m.textContent="Abriendo…";
 try{await abrir(cod);}catch(x){m.textContent="Ese código no es correcto.";}}
