const b2a = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const norm = s => s.trim().toUpperCase().replace(/\s+/g, "");
const msg = document.getElementById("msg"), btn = document.getElementById("btn");
async function abrir(codigo) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(norm(codigo)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b2a(P.s), iterations: P.n, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({name: "AES-GCM", iv: b2a(P.i)}, key, b2a(P.c));
  return new TextDecoder().decode(claro);
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const cod = document.getElementById("cod").value;
  if (!norm(cod)) { msg.textContent = "Escriba el código."; return; }
  btn.disabled = true; msg.className = "msg ok"; msg.textContent = "Abriendo…";
  try {
    const html = await abrir(cod);
    try { sessionStorage.setItem("cod_joyeria", norm(cod)); } catch (x) {}
    document.open(); document.write(html); document.close();
  } catch (x) {
    btn.disabled = false; msg.className = "msg";
    msg.textContent = "Ese código no abre esta demostración. Revíselo y pruebe otra vez.";
    document.getElementById("cod").select();
  }
});
(async () => {
  let g = null;
  try { g = sessionStorage.getItem("cod_joyeria"); } catch (x) {}
  const url = new URLSearchParams(location.search).get("c");
  const cod = url || g;
  if (!cod) return;
  try {
    const html = await abrir(cod);
    document.open(); document.write(html); document.close();
  } catch (x) { try { sessionStorage.removeItem("cod_joyeria"); } catch (y) {} }
})();
</script>
